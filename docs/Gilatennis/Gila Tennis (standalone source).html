<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gila Tennis — Tips, Gear, Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-coral: oklch(64.7% 0.217 57.6);
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Inter Tight', Inter, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; }
    body { background: #ffffff; color: #0a0a0a; }
    .dark body { background: #0a0a0a; color: #fafafa; }
    ::selection { background: oklch(64.7% .217 57.6); color: white; }

    /* Marquee */
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .marquee { animation: marquee 40s linear infinite; }
    .marquee:hover { animation-play-state: paused; }

    /* Smooth dark transitions */
    body, header, section, footer { transition: background-color 0.25s ease, color 0.25s ease; }

    /* Hide horizontal scrollbar nicely */
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); }
    .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#ffffff">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#ffffff"/>
      <g transform="translate(600 400)">
        <circle r="180" fill="oklch(64.7% .217 57.6)"/>
        <text x="0" y="22" font-family="Inter Tight, sans-serif" font-weight="900" font-size="120" fill="white" text-anchor="middle" letter-spacing="-4">G</text>
      </g>
      <text x="600" y="640" font-family="Inter Tight, sans-serif" font-weight="900" font-size="56" fill="#0a0a0a" text-anchor="middle" letter-spacing="-2">Gilatennis</text>
    </svg>
  </template>
  <div id="root"></div>

  <script type="text/babel" src="placeholder.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="header.jsx"></script>
  <script type="text/babel" src="hero.jsx"></script>
  <script type="text/babel" src="articles.jsx"></script>
  <script type="text/babel" src="products.jsx"></script>
  <script type="text/babel" src="tournaments.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "darkMode": false,
      "accent": "oklch(64.7% .217 57.6)",
      "heroVariant": "image-overlay",
      "showFeaturedGearCard": false,
      "showLiveBanner": true
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = window.useTweaks
        ? window.useTweaks(TWEAK_DEFAULTS)
        : [TWEAK_DEFAULTS, () => {}];

      const [dark, setDark] = React.useState(tweaks.darkMode);
      React.useEffect(() => {
        document.documentElement.classList.toggle('dark', dark);
      }, [dark]);
      React.useEffect(() => { setDark(tweaks.darkMode); }, [tweaks.darkMode]);

      // Apply accent color override
      React.useEffect(() => {
        if (tweaks.accent) {
          // Override Tailwind's coral utilities by injecting CSS vars
          const css = `
            .bg-coral{background-color:${tweaks.accent}!important}
            .text-coral{color:${tweaks.accent}!important}
            .border-coral{border-color:${tweaks.accent}!important}
            .hover\\:bg-coral:hover{background-color:${tweaks.accent}!important}
            .hover\\:text-coral:hover{color:${tweaks.accent}!important}
            .hover\\:border-coral:hover{border-color:${tweaks.accent}!important}
            .bg-coral\\/10{background-color:color-mix(in oklch, ${tweaks.accent} 10%, transparent)!important}
            .bg-coral\\/15{background-color:color-mix(in oklch, ${tweaks.accent} 15%, transparent)!important}
          `;
          let tag = document.getElementById('accent-override');
          if (!tag) { tag = document.createElement('style'); tag.id = 'accent-override'; document.head.appendChild(tag); }
          tag.textContent = css;
        }
      }, [tweaks.accent]);

      return (
        <div className="min-h-screen bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100">
          <Header dark={dark} setDark={(v) => { setDark(v); setTweak('darkMode', v); }}/>
          <Hero/>
          <ArticlesGrid/>
          <TrendingGear/>
          <Tournaments/>
          <TrustBar/>
          <Newsletter/>
          <Footer/>

          {window.TweaksPanel && (
            <window.TweaksPanel title="Gila Tennis Tweaks">
              <window.TweakSection title="Theme">
                <window.TweakToggle label="Dark mode" value={tweaks.darkMode} onChange={(v) => setTweak('darkMode', v)}/>
                <window.TweakColor label="Accent color" value={tweaks.accent} onChange={(v) => setTweak('accent', v)}/>
              </window.TweakSection>
              <window.TweakSection title="Hero">
                <window.TweakToggle label="Show featured gear card" value={tweaks.showFeaturedGearCard} onChange={(v) => setTweak('showFeaturedGearCard', v)}/>
                <window.TweakToggle label="Show 'Live' banner" value={tweaks.showLiveBanner} onChange={(v) => setTweak('showLiveBanner', v)}/>
              </window.TweakSection>
              <window.TweakSection title="Quick presets">
                <window.TweakButton label="Coral (default)" onClick={() => setTweak('accent', 'oklch(64.7% .217 57.6)')}/>
                <window.TweakButton label="Court green" onClick={() => setTweak('accent', 'oklch(62% .18 145)')}/>
                <window.TweakButton label="Electric yellow" onClick={() => setTweak('accent', 'oklch(82% .18 100)')}/>
                <window.TweakButton label="Hardcourt blue" onClick={() => setTweak('accent', 'oklch(58% .18 240)')}/>
              </window.TweakSection>
            </window.TweaksPanel>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
