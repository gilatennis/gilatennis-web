name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # Wayfinder's generated modules (resources/js/routes, actions, wayfinder)
      # are gitignored, so they are absent on a fresh checkout. Without them the
      # ESLint import resolver and svelte-check cannot resolve `@/routes/...`
      # and `@/actions/...`, which breaks import/order and type checks.
      - name: Generate Wayfinder artifacts
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan wayfinder:generate --with-form

      - name: Run Pint
        run: composer lint

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check

      - name: Check Frontend Types
        run: npm run types:check

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
